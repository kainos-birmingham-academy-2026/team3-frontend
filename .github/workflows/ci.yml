name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  repository_dispatch:
    types: [backend-dev-deployed, backend-test-deployed]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.action == 'backend-test-deployed' && 'test-environment' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-source:
    name: Resolve Source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'backend-test-deployed' && github.event.client_payload.frontend_ref || github.sha }}
      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Lint and test
    needs: resolve-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type check
        run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build container image
    needs: [resolve-source, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image with registry-free cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            team3-frontend:${{ needs.resolve-source.outputs.sha }}
            team3-frontend:latest
          cache-from: type=gha,scope=team3-frontend
          cache-to: type=gha,mode=max,scope=team3-frontend

  push-image:
    name: Push image to ACR
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.action == 'backend-dev-deployed'
    needs: [resolve-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: team3-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ needs.resolve-source.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha,scope=team3-frontend
          cache-to: type=gha,mode=max,scope=team3-frontend
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ needs.resolve-source.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify images exist in ACR
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          az acr manifest show \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME:dev-$SOURCE_SHA" \
            --query digest --output tsv
          az acr manifest show \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME:dev-latest" \
            --query digest --output tsv

  push-test-image:
    name: Push test image to ACR
    if: github.event.action == 'backend-test-deployed'
    needs: [resolve-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: team3-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ needs.resolve-source.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-latest
          cache-from: type=gha,scope=team3-frontend
          cache-to: type=gha,mode=max,scope=team3-frontend
      - name: Scan test image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ needs.resolve-source.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify test images exist in ACR
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          az acr manifest show \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME:test-$SOURCE_SHA" \
            --query digest --output tsv
          az acr manifest show \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME:test-latest" \
            --query digest --output tsv

  terraform-plan:
    name: Plan dev infrastructure
    if: github.event_name == 'pull_request'
    needs: [resolve-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: dev
      TF_VAR_image_tag: dev-${{ needs.resolve-source.outputs.sha }}
      TF_VAR_container_revision_suffix: run-${{ github.run_id }}-${{ github.run_attempt }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify dev backend deployment
        run: |
          az containerapp show \
            --name "ca-team3-backend-dev" \
            --resource-group "rg-team3-dev" \
            --only-show-errors \
            --output none
      - name: Install tfcmt
        env:
          TFCMT_VERSION: 4.14.18
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/tfcmt.tar.gz \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v${TFCMT_VERSION}/tfcmt_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output /tmp/tfcmt_checksums.txt \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v${TFCMT_VERSION}/tfcmt_${TFCMT_VERSION}_checksums.txt"
          grep '  tfcmt_linux_amd64.tar.gz$' /tmp/tfcmt_checksums.txt \
            | sed 's#tfcmt_linux_amd64.tar.gz#/tmp/tfcmt.tar.gz#' \
            | sha256sum --check
          tar --extract --gzip --file /tmp/tfcmt.tar.gz --directory /tmp tfcmt
          sudo install /tmp/tfcmt /usr/local/bin/tfcmt

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validate Terraform
        run: terraform validate -no-color
      - name: Plan Terraform changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tfcmt -var "target:frontend-dev" plan -- terraform plan -input=false -no-color

  terraform-deploy:
    name: Deploy dev infrastructure
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.action == 'backend-dev-deployed'
    needs: [resolve-source, push-image]
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-infrastructure-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: dev
      TF_VAR_image_tag: dev-${{ needs.resolve-source.outputs.sha }}
      TF_VAR_container_revision_suffix: run-${{ github.run_id }}-${{ github.run_attempt }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: team3-frontend
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - name: Check out infrastructure source
        uses: actions/checkout@v7
      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify dev backend deployment
        run: |
          az containerapp show \
            --name "ca-team3-backend-dev" \
            --resource-group "rg-team3-dev" \
            --only-show-errors \
            --output none
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Validate Terraform
        run: terraform validate -no-color
      - name: Create Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Apply Terraform
        run: terraform apply -input=false -auto-approve tfplan
      - name: Delete dev images older than 48 hours
        run: |
          set -o pipefail
          cutoff=$(date --utc --date='48 hours ago' +'%Y-%m-%dT%H:%M:%SZ')

          az acr manifest list-metadata \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME" \
            --output json \
            | jq --raw-output --arg cutoff "$cutoff" \
              '.[] | (.tags // []) as $tags | select(.lastUpdateTime < $cutoff) | select(any($tags[]; startswith("dev-"))) | select(any($tags[]; . == "latest" or . == "dev-latest") | not) | .digest' \
            | while read -r digest; do
                az acr repository delete \
                  --name "${REGISTRY%%.*}" \
                  --image "$IMAGE_NAME@$digest" \
                  --yes
              done

  terraform-deploy-test:
    name: Deploy test infrastructure
    if: github.event.action == 'backend-test-deployed'
    needs: [resolve-source, push-test-image]
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-infrastructure-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: test
      TF_VAR_image_tag: test-${{ needs.resolve-source.outputs.sha }}
      TF_VAR_container_revision_suffix: run-${{ github.run_id }}-${{ github.run_attempt }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: team3-frontend
    defaults:
      run:
        working-directory: infrastructure/environments/test
    steps:
      - name: Check out infrastructure source
        uses: actions/checkout@v7
      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify test backend deployment
        run: |
          az containerapp show \
            --name "ca-team3-backend-test" \
            --resource-group "rg-team3-test" \
            --only-show-errors \
            --output none
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Validate Terraform
        run: terraform validate -no-color
      - name: Create Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Apply Terraform
        run: terraform apply -input=false -auto-approve tfplan
      - name: Delete test images older than 48 hours
        run: |
          set -o pipefail
          cutoff=$(date --utc --date='48 hours ago' +'%Y-%m-%dT%H:%M:%SZ')

          az acr manifest list-metadata \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME" \
            --output json \
            | jq --raw-output --arg cutoff "$cutoff" \
              '.[] | (.tags // []) as $tags | select(.lastUpdateTime < $cutoff) | select(any($tags[]; startswith("test-"))) | select(any($tags[]; . == "latest" or . == "test-latest") | not) | .digest' \
            | while read -r digest; do
                az acr repository delete \
                  --name "${REGISTRY%%.*}" \
                  --image "$IMAGE_NAME@$digest" \
                  --yes
              done
