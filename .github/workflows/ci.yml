name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  docker-build:
    name: Build Docker Image
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: team3-frontend
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        if: env.PUSH == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: env.PUSH == 'true'
        run: az acr login --name "${REGISTRY%%.*}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.PUSH == 'true' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) || format('{0}:{1}', env.IMAGE_NAME, github.sha) }}
            ${{ env.PUSH == 'true' && format('{0}/{1}:dev-latest', env.REGISTRY, env.IMAGE_NAME) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify push
        if: env.PUSH == 'true'
        run: |
          az acr manifest show \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME:${{ github.sha }}" \
            --query digest --output tsv
          az acr manifest show \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_NAME:dev-latest" \
            --query digest --output tsv

  terraform:
    name: Terraform Dev
    needs: docker-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: dev
      TF_VAR_image_tag: dev-latest
      TF_VAR_container_revision_suffix: sha-${{ github.sha }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tfcmt
        if: github.event_name == 'pull_request'
        env:
          TFCMT_VERSION: 4.14.18
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/tfcmt.tar.gz \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v${TFCMT_VERSION}/tfcmt_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output /tmp/tfcmt_checksums.txt \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v${TFCMT_VERSION}/tfcmt_${TFCMT_VERSION}_checksums.txt"
          grep '  tfcmt_linux_amd64.tar.gz$' /tmp/tfcmt_checksums.txt \
            | sed 's#tfcmt_linux_amd64.tar.gz#/tmp/tfcmt.tar.gz#' \
            | sha256sum --check
          tar --extract --gzip --file /tmp/tfcmt.tar.gz --directory /tmp tfcmt
          sudo install /tmp/tfcmt /usr/local/bin/tfcmt

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Comment Terraform plan
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tfcmt -var "target:frontend-dev" plan -- terraform plan -input=false -no-color

      - name: Create Terraform plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
