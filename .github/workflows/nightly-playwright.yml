name: Nightly Playwright

on:
  schedule:
    - cron: "30 21 * * 0-4"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightly-playwright-dev
  cancel-in-progress: false

jobs:
  test:
    name: Test deployed Dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Dev endpoints
        id: endpoints
        run: |
          frontend_fqdn=$(az containerapp show \
            --resource-group rg-team3-dev \
            --name ca-team3-frontend-dev \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "frontend_url=https://${frontend_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Check Dev health
        env:
          FRONTEND_URL: ${{ steps.endpoints.outputs.frontend_url }}
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "$FRONTEND_URL"

      - name: Run Playwright suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.endpoints.outputs.frontend_url }}
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 30